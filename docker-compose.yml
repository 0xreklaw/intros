# Local development services. Production uses managed Postgres and R2 or S3.
name: intros

services:
  postgres:
    image: postgres:16-alpine
    container_name: intros-postgres
    environment:
      POSTGRES_USER: intros
      POSTGRES_PASSWORD: intros
      POSTGRES_DB: intros
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intros -d intros"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object store that stands in for Cloudflare R2.
  s3:
    image: adobe/s3mock:latest
    container_name: intros-s3
    environment:
      initialBuckets: intros-data
      retainFilesOnExit: "false"
    ports:
      - "${S3_PORT:-9090}:9090"

volumes:
  postgres_data:
